<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Life & Finance</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 15px;
            padding-bottom: 50px;
            user-select: none;
        }

        /* App Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px 5px;
        }

        .app-title {
            font-size: 20px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .month-badge {
            font-size: 11px;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            font-weight: bold;
        }

        /* Summary Glass Cards */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 14px 8px;
            border-radius: 16px;
            text-align: center;
        }

        .stat-card span {
            display: block;
            font-size: 10px;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        .stat-card strong {
            font-size: 13px;
            font-weight: 700;
        }

        .stat-card.income strong { color: var(--success); }
        .stat-card.expense strong { color: var(--danger); }
        .stat-card.balance strong { color: #38bdf8; }

        /* Section Container */
        .glass-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .glass-box h2 {
            font-size: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        /* Form Inputs */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
        }

        input, select, textarea {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        .btn-action {
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            transition: 0.2s;
        }

        .btn-action:active { transform: scale(0.97); }

        .hidden { display: none !important; }

        /* Expense Dynamic Fields */
        .sub-field-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed var(--card-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Lists Styling */
        ul { list-style: none; max-height: 300px; overflow-y: auto; }

        .item-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .item-title { font-size: 13px; font-weight: bold; }
        .item-meta { font-size: 10px; color: var(--text-sub); }
        .item-note { font-size: 11px; color: #cbd5e1; margin-top: 2px; }

        .item-amount { font-size: 13px; font-weight: bold; color: var(--danger); }

        .btn-delete {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            margin-right: 8px;
        }

        /* Task Specifics */
        .task-card {
            border-right: 3px solid var(--primary);
        }

        /* Filter Controls Grid */
        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="app-header">
    <div class="app-title">⚡ Smart System</div>
    <div class="month-badge" id="current-month-label">--</div>
</div>

<!-- DASHBOARD STATS -->
<div class="dashboard-grid">
    <div class="stat-card income">
        <span>مووچە</span>
        <strong id="disp-salary">0</strong>
    </div>
    <div class="stat-card expense">
        <span>مەسرەف</span>
        <strong id="disp-expenses">0</strong>
    </div>
    <div class="stat-card balance">
        <span>توفیر</span>
        <strong id="disp-balance">0</strong>
    </div>
</div>

<!-- 1. SET SALARY -->
<div class="glass-box">
    <h2>💵 دیاریکردنی مووچەی مانگانە</h2>
    <div class="form-group">
        <input type="number" id="salary-input" placeholder="بڕی مووچە (د.ع)">
        <button class="btn-action" onclick="saveSalary()">تۆمارکردنی مووچە</button>
    </div>
</div>

<!-- 2. WORK / TASKS SECTION -->
<div class="glass-box">
    <h2>💼 تۆمارکردنی کاری ڕۆژانە</h2>
    <div class="form-group">
        <label>ناوی کار / ئیش:</label>
        <input type="text" id="task-name" placeholder="نموونە: کۆبوونەوە، پاککردنەوە، پڕۆژە">
        
        <label>بەروار:</label>
        <input type="date" id="task-date">

        <label>تێبینی کارەکە:</label>
        <input type="text" id="task-note" placeholder="ڕوونکردنەوەی زیاتر...">

        <button class="btn-action" onclick="addTask()">زیادکردنی کار</button>
    </div>
    <hr style="margin: 15px 0; border: none; border-top: 1px solid var(--card-border);">
    <ul id="task-list"></ul>
</div>

<!-- 3. EXPENSES ENTRY -->
<div class="glass-box">
    <h2>💳 تۆمارکردنی مەسرەفی ڕۆژانە</h2>
    <div class="form-group">
        <label>بەروار:</label>
        <input type="date" id="exp-date">

        <label>جۆری مەسرەف (کتێگۆری):</label>
        <select id="exp-category" onchange="handleCategoryChange()">
            <option value="خواردن / خواردنەوە">🍔 خواردن / خواردنەوە</option>
            <option value="هاتووچۆ">🚕 هاتووچۆ</option>
            <option value="جل و بەرگ">👕 جل و بەرگ</option>
            <option value="هیتر">📦 هیتر</option>
        </select>

        <!-- DYNAMIC FIELD: FOOD -->
        <div id="field-food" class="sub-field-box">
            <label>جۆری خواردن/خواردنەوە:</label>
            <input type="text" id="food-name" placeholder="نموونە: پیتزا، شەربەت، بەقالی">
            <label>شوێنی خواردن:</label>
            <select id="food-place">
                <option value="لە دەرەوە">لە دەرەوە</option>
                <option value="لە ماڵەوە">لە ماڵەوە</option>
            </select>
        </div>

        <!-- DYNAMIC FIELD: TRANSPORT -->
        <div id="field-transport" class="sub-field-box hidden">
            <label>هۆکاری هاتووچۆ:</label>
            <select id="trans-type">
                <option value="تەکسی">تەکسی</option>
                <option value="پاس">پاس</option>
                <option value="بەنزین">بەنزین</option>
            </select>
            <label>مسار (لە کوێ بۆ کوێ):</label>
            <input type="text" id="trans-route" placeholder="نموونە: لە ماڵەوە بۆ کار">
        </div>

        <!-- DYNAMIC FIELD: CLOTHES -->
        <div id="field-clothes" class="sub-field-box hidden">
            <label>جۆری جلوبەرگ:</label>
            <select id="clothes-item">
                <option value="تی شێرت">تی شێرت</option>
                <option value="پانتۆڵ">پانتۆڵ</option>
                <option value="کراس">کراس</option>
                <option value="کالە">کالە</option>
                <option value="قۆندەرە">قۆندەرە</option>
                <option value="قەمسەڵە">قەمسەڵە</option>
                <option value="چاکەت">چاکەت</option>
                <option value="بیجامە">بیجامە</option>
                <option value="شۆڕت">شۆڕت</option>
            </select>
        </div>

        <!-- DYNAMIC FIELD: OTHER -->
        <div id="field-other" class="sub-field-box hidden">
            <label>ڕوونکردنەوەی جۆرەکە:</label>
            <input type="text" id="other-name" placeholder="بۆ چی بووە؟">
        </div>

        <label>بڕی پارە (د.ع):</label>
        <input type="number" id="exp-amount" placeholder="نرخی مەسرەف">

        <label>تێبینی:</label>
        <input type="text" id="exp-note" placeholder="تێبینیی زیاتر...">

        <button class="btn-action" onclick="addExpense()">زیادکردنی مەسرەف</button>
    </div>
</div>

<!-- 4. ADVANCED FILTER & EXPENSE LIST -->
<div class="glass-box">
    <h2>🔍 فلتەر و لیستی مەسرەفەکان</h2>
    
    <div class="filter-grid">
        <div>
            <label>کتێگۆری:</label>
            <select id="filter-category" onchange="renderExpenses()">
                <option value="هەمووی">هەمووی</option>
                <option value="خواردن / خواردنەوە">خواردن / خواردنەوە</option>
                <option value="هاتووچۆ">هاتووچۆ</option>
                <option value="جل و بەرگ">جل و بەرگ</option>
                <option value="هیتر">هیتر</option>
            </select>
        </div>

        <div>
            <label>ڕێکخستنی نرخ:</label>
            <select id="filter-sort" onchange="renderExpenses()">
                <option value="none">ئاسایی (بەپێی بەروار)</option>
                <option value="low-high">لە کەمەوە بۆ زۆر</option>
                <option value="high-low">لە زۆرەوە بۆ کەم</option>
            </select>
        </div>
    </div>

    <div style="margin-bottom: 15px;">
        <label>فلتەر بەپێی ڕۆژێکی دیاریکراو:</label>
        <input type="date" id="filter-date" onchange="renderExpenses()">
        <button style="background: none; border: none; color: #38bdf8; font-size: 11px; cursor: pointer; margin-top: 4px;" onclick="clearDateFilter()">پاککردنەوەی فلتەری بەروار</button>
    </div>

    <ul id="expense-list"></ul>
</div>

<script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
    }

    function getTodayMonth() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    // App State
    let monthlyArchives = JSON.parse(localStorage.getItem('monthlyArchives')) || [];
    let currentData = JSON.parse(localStorage.getItem('currentMonthData')) || {
        month: getTodayMonth(),
        salary: 0,
        expenses: [],
        tasks: []
    };

    // Auto Rollover Logic
    function checkAutoMonthRollover() {
        const thisMonth = getTodayMonth();
        if (currentData.month !== thisMonth) {
            if (currentData.expenses.length > 0 || currentData.salary > 0 || currentData.tasks.length > 0) {
                const idx = monthlyArchives.findIndex(a => a.month === currentData.month);
                if (idx !== -1) monthlyArchives[idx] = { ...currentData };
                else monthlyArchives.push({ ...currentData });
                localStorage.setItem('monthlyArchives', JSON.stringify(monthlyArchives));
            }

            currentData = {
                month: thisMonth,
                salary: currentData.salary || 0,
                expenses: [],
                tasks: []
            };
            saveCurrentData();
        }
    }

    window.onload = function() {
        checkAutoMonthRollover();
        
        document.getElementById('task-date').valueAsDate = new Date();
        document.getElementById('exp-date').valueAsDate = new Date();
        document.getElementById('current-month-label').innerText = currentData.month;
        document.getElementById('salary-input').value = currentData.salary || '';

        updateUI();
    };

    function saveCurrentData() {
        localStorage.setItem('currentMonthData', JSON.stringify(currentData));
    }

    function saveSalary() {
        const val = parseFloat(document.getElementById('salary-input').value);
        if (!isNaN(val) && val >= 0) {
            currentData.salary = val;
            saveCurrentData();
            updateUI();
            alert('مووچە تۆمارکرا');
        }
    }

    // Task Logic
    function addTask() {
        const name = document.getElementById('task-name').value.trim();
        const date = document.getElementById('task-date').value;
        const note = document.getElementById('task-note').value.trim();

        if (name && date) {
            currentData.tasks.push({ id: Date.now(), name, date, note });
            saveCurrentData();
            document.getElementById('task-name').value = '';
            document.getElementById('task-note').value = '';
            renderTasks();
        } else {
            alert('تکایە ناوی کارەکە و بەروار بە دروستی بنووسە');
        }
    }

    function deleteTask(id) {
        currentData.tasks = currentData.tasks.filter(t => t.id !== id);
        saveCurrentData();
        renderTasks();
    }

    function renderTasks() {
        const list = document.getElementById('task-list');
        list.innerHTML = '';
        const sorted = [...currentData.tasks].sort((a,b) => new Date(b.date) - new Date(a.date));

        sorted.forEach(t => {
            const li = document.createElement('li');
            li.className = 'item-card task-card';
            li.innerHTML = `
                <div class="item-info">
                    <span class="item-title">📌 ${t.name}</span>
                    <span class="item-meta">📅 ${t.date}</span>
                    ${t.note ? `<span class="item-note">📝 ${t.note}</span>` : ''}
                </div>
                <button class="btn-delete" onclick="deleteTask(${t.id})">✕</button>
            `;
            list.appendChild(li);
        });
    }

    // Category Dynamic Switch
    function handleCategoryChange() {
        const cat = document.getElementById('exp-category').value;
        document.getElementById('field-food').classList.add('hidden');
        document.getElementById('field-transport').classList.add('hidden');
        document.getElementById('field-clothes').classList.add('hidden');
        document.getElementById('field-other').classList.add('hidden');

        if (cat === 'خواردن / خواردنەوە') document.getElementById('field-food').classList.remove('hidden');
        else if (cat === 'هاتووچۆ') document.getElementById('field-transport').classList.remove('hidden');
        else if (cat === 'جل و بەرگ') document.getElementById('field-clothes').classList.remove('hidden');
        else if (cat === 'هیتر') document.getElementById('field-other').classList.remove('hidden');
    }

    // Expense Logic
    function addExpense() {
        const date = document.getElementById('exp-date').value;
        const category = document.getElementById('exp-category').value;
        const amount = parseFloat(document.getElementById('exp-amount').value);
        const note = document.getElementById('exp-note').value.trim();

        if (!date || isNaN(amount) || amount <= 0) {
            alert('تکایە بڕی پارە و بەروار بە دروستی بنووسە');
            return;
        }

        let detailStr = '';

        if (category === 'خواردن / خواردنەوە') {
            const foodName = document.getElementById('food-name').value.trim() || 'خواردن';
            const place = document.getElementById('food-place').value;
            detailStr = `${foodName} (${place})`;
        } else if (category === 'هاتووچۆ') {
            const type = document.getElementById('trans-type').value;
            const route = document.getElementById('trans-route').value.trim();
            detailStr = `${type} ${route ? '- ' + route : ''}`;
        } else if (category === 'جل و بەرگ') {
            const item = document.getElementById('clothes-item').value;
            detailStr = item;
        } else if (category === 'هیتر') {
            detailStr = document.getElementById('other-name').value.trim() || 'مەسرەفی گشتی';
        }

        const expObj = {
            id: Date.now(),
            date,
            category,
            detail: detailStr,
            amount,
            note
        };

        currentData.expenses.push(expObj);
        saveCurrentData();

        // Reset Inputs
        document.getElementById('exp-amount').value = '';
        document.getElementById('exp-note').value = '';
        document.getElementById('food-name').value = '';
        document.getElementById('trans-route').value = '';
        document.getElementById('other-name').value = '';

        updateUI();
    }

    function deleteExpense(id) {
        currentData.expenses = currentData.expenses.filter(e => e.id !== id);
        saveCurrentData();
        updateUI();
    }

    function clearDateFilter() {
        document.getElementById('filter-date').value = '';
        renderExpenses();
    }

    function updateUI() {
        const totalExpenses = currentData.expenses.reduce((s, e) => s + e.amount, 0);
        const balance = currentData.salary - totalExpenses;

        document.getElementById('disp-salary').innerText = currentData.salary.toLocaleString();
        document.getElementById('disp-expenses').innerText = totalExpenses.toLocaleString();
        document.getElementById('disp-balance').innerText = balance.toLocaleString();

        renderTasks();
        renderExpenses();
    }

    function renderExpenses() {
        const list = document.getElementById('expense-list');
        list.innerHTML = '';

        const catFilter = document.getElementById('filter-category').value;
        const sortFilter = document.getElementById('filter-sort').value;
        const dateFilter = document.getElementById('filter-date').value;

        let filtered = [...currentData.expenses];

        // Filter Category
        if (catFilter !== 'هەمووی') {
            filtered = filtered.filter(e => e.category === catFilter);
        }

        // Filter Single Date
        if (dateFilter) {
            filtered = filtered.filter(e => e.date === dateFilter);
        }

        // Sorting Logic
        if (sortFilter === 'low-high') {
            filtered.sort((a, b) => a.amount - b.amount);
        } else if (sortFilter === 'high-low') {
            filtered.sort((a, b) => b.amount - a.amount);
        } else {
            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
        }

        if (filtered.length === 0) {
            list.innerHTML = '<li style="text-align:center; color:var(--text-sub); font-size:12px; padding:15px;">هیچ مەسرەفێک نەدۆزرایەوە</li>';
            return;
        }

        filtered.forEach(e => {
            const li = document.createElement('li');
            li.className = 'item-card';
            li.innerHTML = `
                <div class="item-info">
                    <span class="item-title">${e.category}: ${e.detail}</span>
                    <span class="item-meta">📅 ${e.date}</span>
                    ${e.note ? `<span class="item-note">💬 ${e.note}</span>` : ''}
                </div>
                <div style="display:flex; align-items:center;">
                    <span class="item-amount">${e.amount.toLocaleString()}</span>
                    <button class="btn-delete" onclick="deleteExpense(${e.id})">✕</button>
                </div>
            `;
            list.appendChild(li);
        });
    }
</script>

</body>
</html>
