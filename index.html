<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Life & Finance Ultimate</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 15px;
            padding-bottom: 60px;
            user-select: none;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px 5px;
        }

        .app-title {
            font-size: 20px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .month-badge {
            font-size: 11px;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            font-weight: bold;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 14px 8px;
            border-radius: 16px;
            text-align: center;
        }

        .stat-card span { display: block; font-size: 10px; color: var(--text-sub); margin-bottom: 5px; }
        .stat-card strong { font-size: 13px; font-weight: 700; }
        .stat-card.income strong { color: var(--success); }
        .stat-card.expense strong { color: var(--danger); }
        .stat-card.balance strong { color: #38bdf8; }

        .glass-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .glass-box h2 {
            font-size: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-main);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        .form-group { display: flex; flex-direction: column; gap: 10px; }
        label { font-size: 11px; font-weight: 600; color: var(--text-sub); }

        input, select, textarea {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus { border-color: var(--primary); }

        .btn-action {
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            transition: 0.2s;
        }

        .btn-action:active { transform: scale(0.97); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 11px;
            cursor: pointer;
        }

        .hidden { display: none !important; }

        .sub-field-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed var(--card-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        ul { list-style: none; max-height: 350px; overflow-y: auto; }

        .item-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info { display: flex; flex-direction: column; gap: 3px; }
        .item-title { font-size: 13px; font-weight: bold; }
        .item-meta { font-size: 10px; color: var(--text-sub); }
        .item-note { font-size: 11px; color: #cbd5e1; margin-top: 2px; }
        .item-amount { font-size: 13px; font-weight: bold; color: var(--danger); }

        .btn-delete {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            margin-right: 8px;
        }

        .task-card { border-right: 3px solid var(--primary); }
        .task-card.done { opacity: 0.5; text-decoration: line-through; border-right-color: var(--success); }

        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        /* Analytics Chart Bars */
        .chart-bar-wrap {
            margin-bottom: 12px;
        }
        .chart-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 4px;
        }
        .bar-bg {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 10px;
            background: var(--primary-gradient);
            width: 0%;
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>

<div class="app-header">
    <div class="app-title">⚡ Smart System Pro</div>
    <div class="month-badge" id="current-month-label">--</div>
</div>

<!-- DASHBOARD -->
<div class="dashboard-grid">
    <div class="stat-card income">
        <span>مووچە</span>
        <strong id="disp-salary">0</strong>
    </div>
    <div class="stat-card expense">
        <span>مەسرەف</span>
        <strong id="disp-expenses">0</strong>
    </div>
    <div class="stat-card balance">
        <span>توفیر</span>
        <strong id="disp-balance">0</strong>
    </div>
</div>

<!-- ANALYTICS CHART -->
<div class="glass-box">
    <h2>📊 ئامار و ڕێژەی مەسرەفەکان</h2>
    <div id="analytics-container"></div>
</div>

<!-- SALARY -->
<div class="glass-box">
    <h2>💵 دیاریکردنی مووچە</h2>
    <div class="form-group">
        <input type="number" id="salary-input" placeholder="بڕی مووچە (د.ع)">
        <button class="btn-action" onclick="saveSalary()">تۆمارکردن</button>
    </div>
</div>

<!-- TASKS -->
<div class="glass-box">
    <h2>💼 تۆمارکردنی کاری ڕۆژانە</h2>
    <div class="form-group">
        <label>ناوی کار:</label>
        <input type="text" id="task-name" placeholder="ناوی کارەکە...">
        
        <div style="display: flex; gap: 10px;">
            <div style="flex:1;">
                <label>بەروار:</label>
                <input type="date" id="task-date">
            </div>
            <div style="flex:1;">
                <label>کات (سەعات):</label>
                <input type="time" id="task-time">
            </div>
        </div>

        <label>تێبینی:</label>
        <input type="text" id="task-note" placeholder="تێبینی...">

        <button class="btn-action" onclick="addTask()">زیادکردنی کار</button>
    </div>
    <hr style="margin: 15px 0; border: none; border-top: 1px solid var(--card-border);">
    <ul id="task-list"></ul>
</div>

<!-- EXPENSES ENTRY -->
<div class="glass-box">
    <h2>💳 تۆمارکردنی مەسرەف</h2>
    <div class="form-group">
        <label>بەروار:</label>
        <input type="date" id="exp-date">

        <label>کتێگۆری:</label>
        <select id="exp-category" onchange="handleCategoryChange()">
            <option value="خواردن / خواردنەوە">🍔 خواردن / خواردنەوە</option>
            <option value="هاتووچۆ">🚕 هاتووچۆ</option>
            <option value="جل و بەرگ">👕 جل و بەرگ</option>
            <option value="هیتر">📦 هیتر</option>
        </select>

        <div id="field-food" class="sub-field-box">
            <label>جۆری خواردن:</label>
            <input type="text" id="food-name" placeholder="پیتزا، شەربەت...">
            <label>شوێن:</label>
            <select id="food-place">
                <option value="لە دەرەوە">لە دەرەوە</option>
                <option value="لە ماڵەوە">لە ماڵەوە</option>
            </select>
        </div>

        <div id="field-transport" class="sub-field-box hidden">
            <label>هۆکار:</label>
            <select id="trans-type">
                <option value="تەکسی">تەکسی</option>
                <option value="پاس">پاس</option>
                <option value="بەنزین">بەنزین</option>
            </select>
            <label>لە کوێ بۆ کوێ:</label>
            <input type="text" id="trans-route" placeholder="لە ماڵەوە بۆ کار...">
        </div>

        <div id="field-clothes" class="sub-field-box hidden">
            <label>جۆری جلوبەرگ:</label>
            <select id="clothes-item">
                <option value="تی شێرت">تی شێرت</option>
                <option value="پانتۆڵ">پانتۆڵ</option>
                <option value="کراس">کراس</option>
                <option value="کالە">کالە</option>
                <option value="قۆندەرە">قۆندەرە</option>
                <option value="قەمسەڵە">قەمسەڵە</option>
                <option value="چاکەت">چاکەت</option>
                <option value="بیجامە">بیجامە</option>
                <option value="شۆڕت">شۆڕت</option>
            </select>
        </div>

        <div id="field-other" class="sub-field-box hidden">
            <label>ڕوونکردنەوە:</label>
            <input type="text" id="other-name" placeholder="بۆ چی بووە؟">
        </div>

        <label>بڕی پارە (د.ع):</label>
        <input type="number" id="exp-amount" placeholder="نرخی مەسرەف">

        <label>تێبینی:</label>
        <input type="text" id="exp-note" placeholder="تێبینی...">

        <button class="btn-action" onclick="addExpense()">زیادکردن</button>
    </div>
</div>

<!-- SEARCH & EXPENSE LIST -->
<div class="glass-box">
    <h2>
        <span>🔍 گەڕان و فلتەر</span>
        <button class="btn-secondary" onclick="exportToCSV()">📊 Excel</button>
    </h2>

    <div style="margin-bottom: 12px;">
        <input type="text" id="search-box" placeholder="🔎 گەڕانی خێرا لە ناونیشان یان تێبینی..." oninput="renderExpenses()">
    </div>
    
    <div class="filter-grid">
        <div>
            <label>کتێگۆری:</label>
            <select id="filter-category" onchange="renderExpenses()">
                <option value="هەمووی">هەمووی</option>
                <option value="خواردن / خواردنەوە">خواردن / خواردنەوە</option>
                <option value="هاتووچۆ">هاتووچۆ</option>
                <option value="جل و بەرگ">جل و بەرگ</option>
                <option value="هیتر">هیتر</option>
            </select>
        </div>

        <div>
            <label>نرخ:</label>
            <select id="filter-sort" onchange="renderExpenses()">
                <option value="none">بەپێی بەروار</option>
                <option value="low-high">لە کەمەوە بۆ زۆر</option>
                <option value="high-low">لە زۆرەوە بۆ کەم</option>
            </select>
        </div>
    </div>

    <div style="margin-bottom: 15px;">
        <label>ڕۆژێکی دیاریکراو:</label>
        <input type="date" id="filter-date" onchange="renderExpenses()">
        <button style="background: none; border: none; color: #38bdf8; font-size: 11px; cursor: pointer; margin-top: 4px;" onclick="clearDateFilter()">پاککردنەوەی بەروار</button>
    </div>

    <ul id="expense-list"></ul>
</div>

<!-- BACKUP & RESTORE -->
<div class="glass-box">
    <h2>⚙️ پاراستن و گەڕاندنەوەی داتا</h2>
    <div style="display: flex; gap: 10px;">
        <button class="btn-secondary" style="flex:1;" onclick="backupData()">📥 دابەزاندنی Backup</button>
        <button class="btn-secondary" style="flex:1;" onclick="document.getElementById('restore-file').click()">📤 گەڕاندنەوەی Backup</button>
        <input type="file" id="restore-file" class="hidden" accept=".json" onchange="restoreData(event)">
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
    }

    function getTodayMonth() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    let monthlyArchives = JSON.parse(localStorage.getItem('monthlyArchives')) || [];
    let currentData = JSON.parse(localStorage.getItem('currentMonthData')) || {
        month: getTodayMonth(),
        salary: 0,
        expenses: [],
        tasks: []
    };

    function checkAutoMonthRollover() {
        const thisMonth = getTodayMonth();
        if (currentData.month !== thisMonth) {
            if (currentData.expenses.length > 0 || currentData.salary > 0 || currentData.tasks.length > 0) {
                const idx = monthlyArchives.findIndex(a => a.month === currentData.month);
                if (idx !== -1) monthlyArchives[idx] = { ...currentData };
                else monthlyArchives.push({ ...currentData });
                localStorage.setItem('monthlyArchives', JSON.stringify(monthlyArchives));
            }

            currentData = { month: thisMonth, salary: currentData.salary || 0, expenses: [], tasks: [] };
            saveCurrentData();
        }
    }

    window.onload = function() {
        checkAutoMonthRollover();
        document.getElementById('task-date').valueAsDate = new Date();
        document.getElementById('exp-date').valueAsDate = new Date();
        document.getElementById('current-month-label').innerText = currentData.month;
        document.getElementById('salary-input').value = currentData.salary || '';
        updateUI();
    };

    function saveCurrentData() {
        localStorage.setItem('currentMonthData', JSON.stringify(currentData));
    }

    function saveSalary() {
        const val = parseFloat(document.getElementById('salary-input').value);
        if (!isNaN(val) && val >= 0) {
            currentData.salary = val;
            saveCurrentData();
            updateUI();
            alert('مووچە تۆمارکرا');
        }
    }

    // Tasks
    function addTask() {
        const name = document.getElementById('task-name').value.trim();
        const date = document.getElementById('task-date').value;
        const time = document.getElementById('task-time').value;
        const note = document.getElementById('task-note').value.trim();

        if (name && date) {
            currentData.tasks.push({ id: Date.now(), name, date, time, note, completed: false });
            saveCurrentData();
            document.getElementById('task-name').value = '';
            document.getElementById('task-note').value = '';
            renderTasks();
        } else {
            alert('ناوی کارەکە و بەروار پێویستە');
        }
    }

    function toggleTask(id) {
        const t = currentData.tasks.find(x => x.id === id);
        if (t) {
            t.completed = !t.completed;
            saveCurrentData();
            renderTasks();
        }
    }

    function deleteTask(id) {
        currentData.tasks = currentData.tasks.filter(t => t.id !== id);
        saveCurrentData();
        renderTasks();
    }

    function renderTasks() {
        const list = document.getElementById('task-list');
        list.innerHTML = '';
        const sorted = [...currentData.tasks].sort((a,b) => new Date(b.date) - new Date(a.date));

        sorted.forEach(t => {
            const li = document.createElement('li');
            li.className = `item-card task-card ${t.completed ? 'done' : ''}`;
            li.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${t.id})">
                    <div class="item-info">
                        <span class="item-title">${t.name}</span>
                        <span class="item-meta">📅 ${t.date} ${t.time ? '⏰ ' + t.time : ''}</span>
                        ${t.note ? `<span class="item-note">📝 ${t.note}</span>` : ''}
                    </div>
                </div>
                <button class="btn-delete" onclick="deleteTask(${t.id})">✕</button>
            `;
            list.appendChild(li);
        });
    }

    // Dynamic Category
    function handleCategoryChange() {
        const cat = document.getElementById('exp-category').value;
        document.getElementById('field-food').classList.add('hidden');
        document.getElementById('field-transport').classList.add('hidden');
        document.getElementById('field-clothes').classList.add('hidden');
        document.getElementById('field-other').classList.add('hidden');

        if (cat === 'خواردن / خواردنەوە') document.getElementById('field-food').classList.remove('hidden');
        else if (cat === 'هاتووچۆ') document.getElementById('field-transport').classList.remove('hidden');
        else if (cat === 'جل و بەرگ') document.getElementById('field-clothes').classList.remove('hidden');
        else if (cat === 'هیتر') document.getElementById('field-other').classList.remove('hidden');
    }

    // Expense
    function addExpense() {
        const date = document.getElementById('exp-date').value;
        const category = document.getElementById('exp-category').value;
        const amount = parseFloat(document.getElementById('exp-amount').value);
        const note = document.getElementById('exp-note').value.trim();

        if (!date || isNaN(amount) || amount <= 0) {
            alert('تکایە بڕی پارە و بەروار بنووسە');
            return;
        }

        let detailStr = '';
        if (category === 'خواردن / خواردنەوە') {
            const foodName = document.getElementById('food-name').value.trim() || 'خواردن';
            const place = document.getElementById('food-place').value;
            detailStr = `${foodName} (${place})`;
        } else if (category === 'هاتووچۆ') {
            const type = document.getElementById('trans-type').value;
            const route = document.getElementById('trans-route').value.trim();
            detailStr = `${type} ${route ? '- ' + route : ''}`;
        } else if (category === 'جل و بەرگ') {
            detailStr = document.getElementById('clothes-item').value;
        } else if (category === 'هیتر') {
            detailStr = document.getElementById('other-name').value.trim() || 'مەسرەفی گشتی';
        }

        currentData.expenses.push({ id: Date.now(), date, category, detail: detailStr, amount, note });
        saveCurrentData();

        document.getElementById('exp-amount').value = '';
        document.getElementById('exp-note').value = '';
        document.getElementById('food-name').value = '';
        document.getElementById('trans-route').value = '';
        document.getElementById('other-name').value = '';

        updateUI();
    }

    function deleteExpense(id) {
        currentData.expenses = currentData.expenses.filter(e => e.id !== id);
        saveCurrentData();
        updateUI();
    }

    function clearDateFilter() {
        document.getElementById('filter-date').value = '';
        renderExpenses();
    }

    function updateUI() {
        const totalExpenses = currentData.expenses.reduce((s, e) => s + e.amount, 0);
        const balance = currentData.salary - totalExpenses;

        document.getElementById('disp-salary').innerText = currentData.salary.toLocaleString();
        document.getElementById('disp-expenses').innerText = totalExpenses.toLocaleString();
        document.getElementById('disp-balance').innerText = balance.toLocaleString();

        renderAnalytics(totalExpenses);
        renderTasks();
        renderExpenses();
    }

    function renderAnalytics(total) {
        const box = document.getElementById('analytics-container');
        box.innerHTML = '';

        if (total === 0) {
            box.innerHTML = '<span style="font-size:11px; color:var(--text-sub);">هیچ ئامارێک بەردەست نییە</span>';
            return;
        }

        const cats = ['خواردن / خواردنەوە', 'هاتووچۆ', 'جل و بەرگ', 'هیتر'];
        cats.forEach(c => {
            const catTotal = currentData.expenses.filter(e => e.category === c).reduce((s, e) => s + e.amount, 0);
            if (catTotal > 0) {
                const pct = Math.round((catTotal / total) * 100);
                box.innerHTML += `
                    <div class="chart-bar-wrap">
                        <div class="chart-label">
                            <span>${c}</span>
                            <span>${catTotal.toLocaleString()} د.ع (%${pct})</span>
                        </div>
                        <div class="bar-bg">
                            <div class="bar-fill" style="width: ${pct}%;"></div>
                        </div>
                    </div>
                `;
            }
        });
    }

    function renderExpenses() {
        const list = document.getElementById('expense-list');
        list.innerHTML = '';

        const catFilter = document.getElementById('filter-category').value;
        const sortFilter = document.getElementById('filter-sort').value;
        const dateFilter = document.getElementById('filter-date').value;
        const searchText = document.getElementById('search-box').value.toLowerCase().trim();

        let filtered = [...currentData.expenses];

        if (catFilter !== 'هەمووی') filtered = filtered.filter(e => e.category === catFilter);
        if (dateFilter) filtered = filtered.filter(e => e.date === dateFilter);
        if (searchText) {
            filtered = filtered.filter(e => e.detail.toLowerCase().includes(searchText) || (e.note && e.note.toLowerCase().includes(searchText)));
        }

        if (sortFilter === 'low-high') filtered.sort((a, b) => a.amount - b.amount);
        else if (sortFilter === 'high-low') filtered.sort((a, b) => b.amount - a.amount);
        else filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

        if (filtered.length === 0) {
            list.innerHTML = '<li style="text-align:center; color:var(--text-sub); font-size:12px; padding:15px;">هیچ مەسرەفێک نەدۆزرایەوە</li>';
            return;
        }

        filtered.forEach(e => {
            const li = document.createElement('li');
            li.className = 'item-card';
            li.innerHTML = `
                <div class="item-info">
                    <span class="item-title">${e.category}: ${e.detail}</span>
                    <span class="item-meta">📅 ${e.date}</span>
                    ${e.note ? `<span class="item-note">💬 ${e.note}</span>` : ''}
                </div>
                <div style="display:flex; align-items:center;">
                    <span class="item-amount">${e.amount.toLocaleString()}</span>
                    <button class="btn-delete" onclick="deleteExpense(${e.id})">✕</button>
                </div>
            `;
            list.appendChild(li);
        });
    }

    // EXPORT TO EXCEL (CSV)
    function exportToCSV() {
        if (currentData.expenses.length === 0) {
            alert('هیچ مەسرەفێک نییە بۆ هەناردەکردن');
            return;
        }
        let csv = '\uFEFFکتێگۆری,تفاسیل,بەروار,بڕی پارە,تێبینی\n';
        currentData.expenses.forEach(e => {
            csv += `"${e.category}","${e.detail}","${e.date}","${e.amount}","${e.note || ''}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Expenses_${currentData.month}.csv`;
        link.click();
    }

    // BACKUP & RESTORE
    function backupData() {
        const fullBackup = { currentData, monthlyArchives };
        const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `SmartSystem_Backup_${getTodayMonth()}.json`;
        link.click();
    }

    function restoreData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.currentData) {
                    localStorage.setItem('currentMonthData', JSON.stringify(data.currentData));
                    if (data.monthlyArchives) localStorage.setItem('monthlyArchives', JSON.stringify(data.monthlyArchives));
                    location.reload();
                } else {
                    alert('فایلی هەڵەیە');
                }
            } catch (err) {
                alert('کێشەیەک لە خوێندنەوەی فایلەکە هەیە');
            }
        };
        reader.readAsText(file);
    }
</script>
