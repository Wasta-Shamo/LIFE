<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Life & Auto-Archive Sync</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 15px;
            padding-bottom: 60px;
            user-select: none;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px 5px;
        }

        .app-title {
            font-size: 20px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            font-size: 11px;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            font-weight: bold;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 14px 8px;
            border-radius: 16px;
            text-align: center;
        }

        .stat-card span { display: block; font-size: 10px; color: var(--text-sub); margin-bottom: 5px; }
        .stat-card strong { font-size: 13px; font-weight: 700; }
        .stat-card.income strong { color: var(--success); }
        .stat-card.expense strong { color: var(--danger); }
        .stat-card.balance strong { color: #38bdf8; }

        .glass-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .glass-box h2 {
            font-size: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-main);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        .form-group { display: flex; flex-direction: column; gap: 10px; }
        label { font-size: 11px; font-weight: 600; color: var(--text-sub); }

        input, select, textarea {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus { border-color: var(--primary); }

        .btn-action {
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            transition: 0.2s;
        }

        .btn-action:active { transform: scale(0.97); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 11px;
            cursor: pointer;
        }

        .hidden { display: none !important; }

        .sub-field-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed var(--card-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        ul { list-style: none; max-height: 350px; overflow-y: auto; }

        .item-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info { display: flex; flex-direction: column; gap: 3px; }
        .item-title { font-size: 13px; font-weight: bold; }
        .item-meta { font-size: 10px; color: var(--text-sub); }
        .item-note { font-size: 11px; color: #cbd5e1; margin-top: 2px; }
        .item-amount { font-size: 13px; font-weight: bold; color: var(--danger); }

        .btn-delete {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            margin-right: 8px;
        }

        .task-card { border-right: 3px solid var(--primary); }
        .task-card.done { opacity: 0.5; text-decoration: line-through; border-right-color: var(--success); }

        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .chart-bar-wrap { margin-bottom: 12px; }
        .chart-label { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
        .bar-bg { background: rgba(255,255,255,0.05); border-radius: 10px; height: 8px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 10px; background: var(--primary-gradient); width: 0%; transition: width 0.4s ease; }

        @media print {
            body { background-color: #fff !important; color: #000 !important; padding: 0 !important; }
            .glass-box, .stat-card { background: #fff !important; border: 1px solid #ccc !important; color: #000 !important; box-shadow: none !important; }
            .form-group, .btn-action, .btn-secondary, .btn-delete, #search-box, .filter-grid, #filter-date, input, select, button, .sync-box { display: none !important; }
            .app-title, .status-badge, .stat-card strong, .item-title, .item-note { color: #000 !important; -webkit-text-fill-color: initial !important; }
            ul { max-height: none !important; }
        }
    </style>
</head>
<body>

<div class="app-header">
    <div class="app-title">⚡ Smart System Sync</div>
    <div class="status-badge" id="sync-status">پچڕاوە ⚪</div>
</div>

<!-- CONNECT DEVICE BOX -->
<div class="glass-box sync-box" style="background: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.3);">
    <h2 style="border:none; margin-bottom:8px;">🔗 بەستنەوەی مۆبایل و لاپتۆپ</h2>
    <div style="display:flex; gap:8px;">
        <input type="text" id="sync-code-input" placeholder="کۆدێک دیاری بکە (مثلاً: khalil123)">
        <button class="btn-secondary" style="background:var(--primary); color:#fff; font-weight:bold; white-space:nowrap;" onclick="connectSync()">بەستنەوە</button>
    </div>
</div>

<!-- ARCHIVE & MONTH SELECTOR -->
<div class="glass-box" style="border-color: rgba(245, 158, 11, 0.3);">
    <h2>📚 ئەرشیفی خەزنکراوی مانگەکان</h2>
    <div class="form-group">
        <label>سەیرکردنی مانگی ئێستا یان مانگەکانی ڕابردوو:</label>
        <select id="archive-selector" onchange="loadSelectedMonth()">
            <option value="current">📅 مانگی ئێستا (چالاک)</option>
        </select>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard-grid">
    <div class="stat-card income">
        <span>مووچە</span>
        <strong id="disp-salary">0</strong>
    </div>
    <div class="stat-card expense">
        <span>مەسرەف</span>
        <strong id="disp-expenses">0</strong>
    </div>
    <div class="stat-card balance">
        <span>توفیر</span>
        <strong id="disp-balance">0</strong>
    </div>
</div>

<!-- ANALYTICS CHART -->
<div class="glass-box">
    <h2>📊 ئامار و ڕێژەی مەسرەفەکان</h2>
    <div id="analytics-container"></div>
</div>

<!-- SALARY -->
<div class="glass-box main-input-field">
    <h2>💵 دیاریکردنی مووچە</h2>
    <div class="form-group">
        <input type="number" id="salary-input" placeholder="بڕی مووچە (د.ع)">
        <button class="btn-action" onclick="saveSalary()">تۆمارکردن</button>
    </div>
</div>

<!-- TASKS -->
<div class="glass-box main-input-field">
    <h2>💼 تۆمارکردنی کاری ڕۆژانە</h2>
    <div class="form-group">
        <label>ناوی کار:</label>
        <input type="text" id="task-name" placeholder="ناوی کارەکە...">
        
        <div style="display: flex; gap: 10px;">
            <div style="flex:1;">
                <label>بەروار:</label>
                <input type="date" id="task-date">
            </div>
            <div style="flex:1;">
                <label>کات (سەعات):</label>
                <input type="time" id="task-time">
            </div>
        </div>

        <label>تێبینی:</label>
        <input type="text" id="task-note" placeholder="تێبینی...">

        <button class="btn-action" onclick="addTask()">زیادکردنی کار</button>
    </div>
    <hr style="margin: 15px 0; border: none; border-top: 1px solid var(--card-border);">
    <ul id="task-list"></ul>
</div>

<!-- EXPENSES ENTRY -->
<div class="glass-box main-input-field">
    <h2>💳 تۆمارکردنی مەسرەف</h2>
    <div class="form-group">
        <label>بەروار:</label>
        <input type="date" id="exp-date">

        <label>کتێگۆری:</label>
        <select id="exp-category" onchange="handleCategoryChange()">
            <option value="خواردن / خواردنەوە">🍔 خواردن / خواردنەوە</option>
            <option value="هاتووچۆ">🚕 هاتووچۆ</option>
            <option value="جل و بەرگ">👕 جل و بەرگ</option>
            <option value="هیتر">📦 هیتر</option>
        </select>

        <div id="field-food" class="sub-field-box">
            <label>جۆری خواردن:</label>
            <input type="text" id="food-name" placeholder="پیتزا، شەربەت...">
            <label>شوێن:</label>
            <select id="food-place">
                <option value="لە دەرەوە">لە دەرەوە</option>
                <option value="لە ماڵەوە">لە ماڵەوە</option>
            </select>
        </div>

        <div id="field-transport" class="sub-field-box hidden">
            <label>هۆکار:</label>
            <select id="trans-type">
                <option value="تەکسی">تەکسی</option>
                <option value="پاس">پاس</option>
                <option value="بەنزین">بەنزین</option>
            </select>
            <label>لە کوێ بۆ کوێ:</label>
            <input type="text" id="trans-route" placeholder="لە ماڵەوە بۆ کار...">
        </div>

        <div id="field-clothes" class="sub-field-box hidden">
            <label>جۆری جلوبەرگ:</label>
            <select id="clothes-item">
                <option value="تی شێرت">تی شێرت</option>
                <option value="پانتۆڵ">پانتۆڵ</option>
                <option value="کراس">کراس</option>
                <option value="کالە">کالە</option>
                <option value="قۆندەرە">قۆندەرە</option>
                <option value="قەمسەڵە">قەمسەڵە</option>
                <option value="چاکەت">چاکەت</option>
                <option value="بیجامە">بیجامە</option>
                <option value="شۆڕت">شۆڕت</option>
            </select>
        </div>

        <div id="field-other" class="sub-field-box hidden">
            <label>ڕوونکردنەوە:</label>
            <input type="text" id="other-name" placeholder="بۆ چی بووە؟">
        </div>

        <label>بڕی پارە (د.ع):</label>
        <input type="number" id="exp-amount" placeholder="نرخی مەسرەف">

        <label>تێبینی:</label>
        <input type="text" id="exp-note" placeholder="تێبینی...">

        <button class="btn-action" onclick="addExpense()">زیادکردن</button>
    </div>
</div>

<!-- SEARCH & EXPENSE LIST -->
<div class="glass-box">
    <h2>
        <span>🔍 گەڕان و فلتەر</span>
        <div>
            <button class="btn-secondary" onclick="printReport()">🖨️ پرێنت</button>
            <button class="btn-secondary" onclick="exportToCSV()">📊 Excel</button>
        </div>
    </h2>

    <div style="margin-bottom: 12px;">
        <input type="text" id="search-box" placeholder="🔎 گەڕانی خێرا..." oninput="renderExpenses()">
    </div>
    
    <div class="filter-grid">
        <div>
            <label>کتێگۆری:</label>
            <select id="filter-category" onchange="renderExpenses()">
                <option value="هەمووی">هەمووی</option>
                <option value="خواردن / خواردنەوە">خواردن / خواردنەوە</option>
                <option value="هاتووچۆ">هاتووچۆ</option>
                <option value="جل و بەرگ">جل و بەرگ</option>
                <option value="هیتر">هیتر</option>
            </select>
        </div>

        <div>
            <label>نرخ:</label>
            <select id="filter-sort" onchange="renderExpenses()">
                <option value="none">بەپێی بەروار</option>
                <option value="low-high">لە کەمەوە بۆ زۆر</option>
                <option value="high-low">لە زۆرەوە بۆ کەم</option>
            </select>
        </div>
    </div>

    <div style="margin-bottom: 15px;">
        <label>ڕۆژێکی دیاریکراو:</label>
        <input type="date" id="filter-date" onchange="renderExpenses()">
        <button style="background: none; border: none; color: #38bdf8; font-size: 11px; cursor: pointer; margin-top: 4px;" onclick="clearDateFilter()">پاککردنەوەی بەروار</button>
    </div>

    <ul id="expense-list"></ul>
</div>

<script>
    let currentSyncCode = localStorage.getItem('user_sync_code') || '';
    let pollInterval = null;
    let viewingMonthKey = 'current';

    let appData = JSON.parse(localStorage.getItem('smartAppData')) || {
        currentMonth: getCurrentMonthKey(),
        currentData: { salary: 0, expenses: [], tasks: [] },
        archives: {}
    };

    function getCurrentMonthKey() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    window.onload = function() {
        document.getElementById('task-date').valueAsDate = new Date();
        document.getElementById('exp-date').valueAsDate = new Date();

        // ڕاستەوخۆ دەستنیشانی دەکات ئەگەر مانگ گۆڕابێت خۆکارانە مانگی پێشوو ئەرشیف دەکات
        checkAutoMonthRollover();
        populateArchiveSelector();

        if (currentSyncCode) {
            document.getElementById('sync-code-input').value = currentSyncCode;
            startSync();
        }
        updateUI();
    };

    function checkAutoMonthRollover() {
        const nowKey = getCurrentMonthKey();
        if (!appData.currentMonth) appData.currentMonth = nowKey;

        // کاتێک مانگ گۆڕا (بۆ نموونە بووە مانگی نوێ)
        if (appData.currentMonth !== nowKey) {
            if (!appData.archives) appData.archives = {};
            
            // مانگی کۆن ئۆتۆماتیکی پاشەکەوت دەکات لە ئەرشیف
            appData.archives[appData.currentMonth] = JSON.parse(JSON.stringify(appData.currentData));
            
            // لاپەڕەی مانگی نوێ ئامادە دەکات
            appData.currentMonth = nowKey;
            appData.currentData = { salary: 0, expenses: [], tasks: [] };
            pushDataToCloud();
        }
    }

    function populateArchiveSelector() {
        const sel = document.getElementById('archive-selector');
        sel.innerHTML = `<option value="current">📅 مانگی ئێستا (${appData.currentMonth})</option>`;
        
        if (appData.archives) {
            Object.keys(appData.archives).sort().reverse().forEach(key => {
                sel.innerHTML += `<option value="${key}">📁 ئەرشیفی مانگی ${key}</option>`;
            });
        }
    }

    function loadSelectedMonth() {
        viewingMonthKey = document.getElementById('archive-selector').value;
        const inputs = document.querySelectorAll('.main-input-field');
        
        if (viewingMonthKey !== 'current') {
            inputs.forEach(el => el.style.display = 'none'); // کاتێک سەیری ئەرشیف دەکات بەشی زیادکردن دەشارێتەوە
        } else {
            inputs.forEach(el => el.style.display = 'block');
        }
        updateUI();
    }

    function getActiveData() {
        if (viewingMonthKey === 'current') return appData.currentData;
        return appData.archives[viewingMonthKey] || { salary: 0, expenses: [], tasks: [] };
    }

    function connectSync() {
        const code = document.getElementById('sync-code-input').value.trim();
        if (code.length < 3) {
            alert('تکایە کۆدێک بنووسە کە لانیکەم ٣ پیت یان ژمارە بێت');
            return;
        }
        currentSyncCode = code;
        localStorage.setItem('user_sync_code', currentSyncCode);
        startSync();
        pushDataToCloud();
    }

    function startSync() {
        if (pollInterval) clearInterval(pollInterval);
        document.getElementById('sync-status').innerText = 'بەستراوەتەوە 🟢';
        document.getElementById('sync-status').style.color = '#34d399';
        
        fetchDataFromCloud();
        pollInterval = setInterval(fetchDataFromCloud, 3000);
    }

    function pushDataToCloud() {
        localStorage.setItem('smartAppData', JSON.stringify(appData));
        if (!currentSyncCode) return;

        fetch(`https://api.npoint.io/` + hashString(currentSyncCode), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(appData)
        }).catch(err => console.log(err));
    }

    function fetchDataFromCloud() {
        if (!currentSyncCode) return;

        fetch(`https://api.npoint.io/` + hashString(currentSyncCode))
            .then(res => res.json())
            .then(data => {
                if (data && typeof data === 'object' && data.currentData) {
                    appData = data;
                    localStorage.setItem('smartAppData', JSON.stringify(appData));
                    checkAutoMonthRollover();
                    populateArchiveSelector();
                    updateUI();
                }
            }).catch(err => console.log(err));
    }

    function hashString(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = (hash << 5) - hash + str.charCodeAt(i);
            hash |= 0;
        }
        return 'sync' + Math.abs(hash);
    }

    function saveSalary() {
        if (viewingMonthKey !== 'current') return;
        const val = parseFloat(document.getElementById('salary-input').value);
        if (!isNaN(val) && val >= 0) {
            appData.currentData.salary = val;
            pushDataToCloud();
            updateUI();
        }
    }

    // Tasks
    function addTask() {
        if (viewingMonthKey !== 'current') return;
        const name = document.getElementById('task-name').value.trim();
        const date = document.getElementById('task-date').value;
        const time = document.getElementById('task-time').value;
        const note = document.getElementById('task-note').value.trim();

        if (name && date) {
            if (!appData.currentData.tasks) appData.currentData.tasks = [];
            appData.currentData.tasks.push({ id: Date.now(), name, date, time, note, completed: false });
            pushDataToCloud();
            document.getElementById('task-name').value = '';
            document.getElementById('task-note').value = '';
            updateUI();
        }
    }

    function toggleTask(id) {
        if (viewingMonthKey !== 'current') return;
        const t = appData.currentData.tasks.find(x => x.id === id);
        if (t) {
            t.completed = !t.completed;
            pushDataToCloud();
            updateUI();
        }
    }

    function deleteTask(id) {
        if (viewingMonthKey !== 'current') return;
        appData.currentData.tasks = appData.currentData.tasks.filter(t => t.id !== id);
        pushDataToCloud();
        updateUI();
    }

    function renderTasks() {
        const list = document.getElementById('task-list');
        list.innerHTML = '';
        const data = getActiveData();
        const sorted = [...(data.tasks || [])].sort((a,b) => new Date(b.date) - new Date(a.date));

        sorted.forEach(t => {
            const li = document.createElement('li');
            li.className = `item-card task-card ${t.completed ? 'done' : ''}`;
            li.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px;">
                    ${viewingMonthKey === 'current' ? `<input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${t.id})">` : ''}
                    <div class="item-info">
                        <span class="item-title">${t.name}</span>
                        <span class="item-meta">📅 ${t.date} ${t.time ? '⏰ ' + t.time : ''}</span>
                        ${t.note ? `<span class="item-note">📝 ${t.note}</span>` : ''}
                    </div>
                </div>
                ${viewingMonthKey === 'current' ? `<button class="btn-delete" onclick="deleteTask(${t.id})">✕</button>` : ''}
            `;
            list.appendChild(li);
        });
    }

    // Category
    function handleCategoryChange() {
        const cat = document.getElementById('exp-category').value;
        document.getElementById('field-food').classList.add('hidden');
        document.getElementById('field-transport').classList.add('hidden');
        document.getElementById('field-clothes').classList.add('hidden');
        document.getElementById('field-other').classList.add('hidden');

        if (cat === 'خواردن / خواردنەوە') document.getElementById('field-food').classList.remove('hidden');
        else if (cat === 'هاتووچۆ') document.getElementById('field-transport').classList.remove('hidden');
        else if (cat === 'جل و بەرگ') document.getElementById('field-clothes').classList.remove('hidden');
        else if (cat === 'هیتر') document.getElementById('field-other').classList.remove('hidden');
    }

    // Expense
    function addExpense() {
        if (viewingMonthKey !== 'current') return;
        const date = document.getElementById('exp-date').value;
        const category = document.getElementById('exp-category').value;
        const amount = parseFloat(document.getElementById('exp-amount').value);
        const note = document.getElementById('exp-note').value.trim();

        if (!date || isNaN(amount) || amount <= 0) {
            alert('تکایە بڕی پارە و بەروار بنووسە');
            return;
        }

        let detailStr = '';
        if (category === 'خواردن / خواردنەوە') {
            const foodName = document.getElementById('food-name').value.trim() || 'خواردن';
            const place = document.getElementById('food-place').value;
            detailStr = `${foodName} (${place})`;
        } else if (category === 'هاتووچۆ') {
            const type = document.getElementById('trans-type').value;
            const route = document.getElementById('trans-route').value.trim();
            detailStr = `${type} ${route ? '- ' + route : ''}`;
        } else if (category === 'جل و بەرگ') {
            detailStr = document.getElementById('clothes-item').value;
        } else if (category === 'هیتر') {
            detailStr = document.getElementById('other-name').value.trim() || 'مەسرەفی گشتی';
        }

        if (!appData.currentData.expenses) appData.currentData.expenses = [];
        appData.currentData.expenses.push({ id: Date.now(), date, category, detail: detailStr, amount, note });
        pushDataToCloud();

        document.getElementById('exp-amount').value = '';
        document.getElementById('exp-note').value = '';
        document.getElementById('food-name').value = '';
        document.getElementById('trans-route').value = '';
        document.getElementById('other-name').value = '';

        updateUI();
    }

    function deleteExpense(id) {
        if (viewingMonthKey !== 'current') return;
        appData.currentData.expenses = appData.currentData.expenses.filter(e => e.id !== id);
        pushDataToCloud();
        updateUI();
    }

    function clearDateFilter() {
        document.getElementById('filter-date').value = '';
        renderExpenses();
    }

    function updateUI() {
        const data = getActiveData();
        const expenses = data.expenses || [];
        const totalExpenses = expenses.reduce((s, e) => s + e.amount, 0);
        const balance = (data.salary || 0) - totalExpenses;

        document.getElementById('disp-salary').innerText = (data.salary || 0).toLocaleString();
        document.getElementById('disp-expenses').innerText = totalExpenses.toLocaleString();
        document.getElementById('disp-balance').innerText = balance.toLocaleString();

        if (viewingMonthKey === 'current') {
            document.getElementById('salary-input').value = data.salary || '';
        }

        renderAnalytics(totalExpenses);
        renderTasks();
        renderExpenses();
    }

    function renderAnalytics(total) {
        const box = document.getElementById('analytics-container');
        box.innerHTML = '';
        const data = getActiveData();
        const expenses = data.expenses || [];

        if (total === 0) {
            box.innerHTML = '<span style="font-size:11px; color:var(--text-sub);">هیچ ئامارێک بەردەست نییە</span>';
            return;
        }

        const cats = ['خواردن / خواردنەوە', 'هاتووچۆ', 'جل و بەرگ', 'هیتر'];
        cats.forEach(c => {
            const catTotal = expenses.filter(e => e.category === c).reduce((s, e) => s + e.amount, 0);
            if (catTotal > 0) {
                const pct = Math.round((catTotal / total) * 100);
                box.innerHTML += `
                    <div class="chart-bar-wrap">
                        <div class="chart-label">
                            <span>${c}</span>
                            <span>${catTotal.toLocaleString()} د.ع (%${pct})</span>
                        </div>
                        <div class="bar-bg">
                            <div class="bar-fill" style="width: ${pct}%;"></div>
                        </div>
                    </div>
                `;
            }
        });
    }

    function renderExpenses() {
        const list = document.getElementById('expense-list');
        list.innerHTML = '';

        const data = getActiveData();
        const catFilter = document.getElementById('filter-category').value;
        const sortFilter = document.getElementById('filter-sort').value;
        const dateFilter = document.getElementById('filter-date').value;
        const searchText = document.getElementById('search-box').value.toLowerCase().trim();

        let filtered = [...(data.expenses || [])];

        if (catFilter !== 'هەمووی') filtered = filtered.filter(e => e.category === catFilter);
        if (dateFilter) filtered = filtered.filter(e => e.date === dateFilter);
        if (searchText) {
            filtered = filtered.filter(e => e.detail.toLowerCase().includes(searchText) || (e.note && e.note.toLowerCase().includes(searchText)));
        }

        if (sortFilter === 'low-high') filtered.sort((a, b) => a.amount - b.amount);
        else if (sortFilter === 'high-low') filtered.sort((a, b) => b.amount - a.amount);
        else filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

        if (filtered.length === 0) {
            list.innerHTML = '<li style="text-align:center; color:var(--text-sub); font-size:12px; padding:15px;">هیچ مەسرەفێک نەدۆزرایەوە</li>';
            return;
        }

        filtered.forEach(e => {
            const li = document.createElement('li');
            li.className = 'item-card';
            li.innerHTML = `
                <div class="item-info">
                    <span class="item-title">${e.category}: ${e.detail}</span>
                    <span class="item-meta">📅 ${e.date}</span>
                    ${e.note ? `<span class="item-note">💬 ${e.note}</span>` : ''}
                </div>
                <div style="display:flex; align-items:center;">
                    <span class="item-amount">${e.amount.toLocaleString()}</span>
                    ${viewingMonthKey === 'current' ? `<button class="btn-delete" onclick="deleteExpense(${e.id})">✕</button>` : ''}
                </div>
            `;
            list.appendChild(li);
        });
    }

    function printReport() { window.print(); }

    function exportToCSV() {
        const data = getActiveData();
        const expenses = data.expenses || [];
        if (expenses.length === 0) { alert('هیچ مەسرەفێک نییە'); return; }
        let csv = '\uFEFFکتێگۆری,تفاسیل,بەروار,بڕی پارە,تێبینی\n';
        expenses.forEach(e => { csv += `"${e.category}","${e.detail}","${e.date}","${e.amount}","${e.note || ''}"\n`; });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Expenses_${viewingMonthKey}.csv`;
        link.click();
    }
</script>
